name: Fetch Weekly Oil Bulletin

on:
  schedule:
    # Bulletin comes out Wednesday/Thursday. Thursday 15:00 UTC, Friday 09:00 UTC as a retry.
    - cron: "0 15 * * 4"
    - cron: "0 9 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python fetch_wob.py

      - name: Commit if anything changed
        run: |
          git config user.name "wob-bot"
          git config user.email "wob-bot@users.noreply.github.com"
          git add data/latest
          if git diff --cached --quiet; then
            echo "No change in the bulletin files"
            exit 0
          fi
          git add data/archive
          git commit -m "WOB update $(date -u +%Y-%m-%d)"
          git push
